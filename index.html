    <div class="li" data-act="go" data-v="fam"><div class="ic">👨‍👩‍👦</div><div class="info"><b>العائلة والأصدقاء</b><small>${dg(S.people.length)} أشخاص</small></div><span class="muted">‹</span></div>
    <div class="li" data-act="sadSet"><div class="ic">🤲</div><div class="info"><b>نسبة الصدقة الشهرية</b><small>${+st.sadaqaPct?fmtN(st.sadaqaPct,2)+'% من '+(st.sadaqaBase==='salary'?'الراتب':'الدخل'):'غير محددة'}</small></div><span class="muted">‹</span></div>
    <div class="li" data-act="go" data-v="zakat"><div class="ic">🕌</div><div class="info"><b>الزكاة</b><small>${S.zakat.goldPrice?'سعر الذهب '+money(S.zakat.goldPrice)+' للغرام':'أدخل سعر الذهب والحول'}</small></div><span class="muted">‹</span></div></div>`)}
  ${sec('التقارير','',`<button class="btn gold" data-act="report" data-s="all">📄 التقرير الشامل (PDF · Excel)</button>`)}
  ${sec('المزامنة بين أجهزتي','',`<div class="card flat"><div class="row"><div><b style="font-size:14px">🔄 مزامنة تلقائية مشفّرة</b><div id="syncState" style="font-size:12px;margin-top:4px">${syncStateHTML()}</div></div></div>
    <p class="muted" style="font-size:12px;line-height:1.8;margin-top:8px">عند تفعيلها تُرفع كل إضافة أو تعديل تلقائياً بعد ثوانٍ، وتصل لأجهزتك الأخرى عند فتح التطبيق فيها. البيانات مشفّرة بكلمة سرك قبل أن تغادر جهازك.</p>
    ${SY.on?`<div class="btns"><button class="btn gold" data-act="syncNowBtn">مزامنة الآن</button><button class="btn danger" data-act="syncOff">إيقاف</button></div>`:`<button class="btn gold" style="margin-top:10px" data-act="syncSetup">ربط أجهزتي</button>`}</div>`)}
  ${sec('بياناتك','',`<div class="card flat"><p class="muted" style="font-size:12px;line-height:1.8">كل بياناتك محفوظة على هذا الجهاز فقط. صدّر نسخة احتياطية بشكل دوري واحفظها في الملفات أو iCloud، وبها تنقل بياناتك لجهاز آخر.</p>
    <div class="btns"><button class="btn gold" data-act="backup">⬇ تصدير نسخة</button><button class="btn ghost" data-act="restore">⬆ استيراد نسخة</button></div>
    <button class="btn danger" data-act="wipe" style="margin-top:10px">مسح كل البيانات</button>
    <input type="file" id="restoreFile" accept=".json,application/json" style="display:none"></div>`)}
  ${sec('حول التطبيق','',`<div class="card about"><div class="row" style="justify-content:flex-start;gap:14px"><div class="logo" style="width:56px;height:56px;font-size:26px;border-radius:17px">خ</div>
    <div><b class="kufi" style="font-size:20px">${APP}</b><br><small class="muted">إدارة الأموال الشخصية والعائلية</small></div><span class="badge" style="margin-inline-start:auto">الإصدار ${nm(dg(APP_VER))}</span></div>
    <div class="kv"><div><small>تصميم وتطوير</small><b>${DEV}</b></div><div><small>تاريخ الإصدار</small><b>${APP_DATE}</b></div>
    <div style="grid-column:1/-1"><small>المصدر</small><b><a href="https://github.com/PROG-ALONE/khizana" target="_blank" rel="noopener" style="color:var(--gold);text-decoration:none" class="num">github.com/PROG-ALONE/khizana</a></b></div></div>
    <p class="muted" style="font-size:12px;margin-top:12px;line-height:1.8">يعمل بدون إنترنت بعد أول فتح · بياناتك محفوظة على جهازك فقط ولا تُرسل لأي خادم.</p></div>`)}
  ${sec('للتقييم والمراجعة','',reviewHTML())}
  ${sec('طريقة التثبيت','',`<button class="btn ghost" data-act="installHelp">📲 كيف أثبّت التطبيق على الآيفون والأندرويد</button>`)}
  <p class="note sign" dir="rtl"><bdi dir="ltr">© ${dg(new Date().getFullYear())}</bdi> ${SIGN}</p>`};
ACT.setOpt=d=>{S.settings[d.k]=d.v;save();if(d.k==='theme')applyTheme();render(false)};
document.addEventListener('change',e=>{
  if(e.target.id==='setRate'){const r=toNum(e.target.value);if(r>0){S.settings.rate=r;save();toast('حُدّث سعر الصرف ✓')}}
  if(e.target.id==='setUser'){S.settings.user=e.target.value.trim();save();greet();toast('تم الحفظ ✓')}
  if(e.target.id==='restoreFile'){const file=e.target.files[0];if(!file)return;const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!d.settings||!Array.isArray(d.tx))throw 0;if(!confirm('استبدال بياناتك الحالية بهذه النسخة؟'))return;
      S=d;normalize();save();applyTheme();greet();VM=NOWK().split('-').map(Number);go('home',null,true);toast('اُستُعيدت النسخة ✓')}catch(_){toast('الملف غير صالح')}};rd.readAsText(file);e.target.value=''}});
ACT.backup=async()=>{const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),name=`khizana-backup-${TODAY()}.json`;
  try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'نسخة '+APP});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('صُدّرت النسخة ✓')};
ACT.restore=()=>$('#restoreFile').click();
ACT.wipe=()=>{if(!confirm('مسح كل البيانات نهائياً؟ صدّر نسخة احتياطية أولاً.'))return;if(!confirm('تأكيد أخير: سيُحذف كل شيء.'))return;
  const st=S.settings;S=blank();S.settings=st;save();go('home',null,true);toast('مُسحت البيانات')};

/* =====================================================================
   init
   ===================================================================== */
function greet(){const h=new Date().getHours();$('#greet').textContent=h<12?'صباح الخير':h<17?'نهارك سعيد':'مساء الخير';$('#uname').textContent=S.settings.user||'أهلاً بك'}
function buildSideNav(){const L=[['wallets','المحافظ'],['savings','الادخار'],['jam','الجمعيات'],['prop','العقارات'],['debts','الديون والأقساط'],['goals','الأهداف'],['commit','الالتزامات'],['fam','العائلة والأصدقاء'],['inv','الاستثمارات'],['sadaqa','الصدقات'],['zakat','الزكاة'],['tx','الحركات'],['cats','الفئات']];
  $('nav .in-nav').insertAdjacentHTML('beforeend',`<div class="nav-sep d-only">الأقسام</div>${L.map(([v,l])=>`<button class="d-only" data-act="go" data-v="${v}" data-nav="${v}">${svgI(v)}${l}</button>`).join('')}
    <div class="nav-sep d-only">أخرى</div><button class="d-only" data-act="report" data-s="all" style="order:97">${svgI('rep')}التقرير الشامل</button>
    <div class="nav-sign d-only" data-act="go" data-v="set">الإصدار ${APP_VER}<br>تصميم وتطوير <b>${DEV}</b></div>`)}
function splash(){const s=document.createElement('div');s.id='splash';s.innerHTML=`<div class="sp-in"><div class="logo">خ</div><h1>${APP}</h1><p>إدارة الأموال بوعي</p><small>تصميم وتطوير ${DEV} · الإصدار ${APP_VER}</small></div>`;
  document.body.appendChild(s);setTimeout(()=>s.classList.add('out'),1300);setTimeout(()=>s.remove(),1900)}
load();BOOTED=true;VM=NOWK().split('-').map(Number);applyTheme();greet();buildSideNav();splash();render(true);syncBadge();setTimeout(()=>syncNow(),1500);setTimeout(()=>{if(!$('#sheet').classList.contains('on'))installGuide()},2300);
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
