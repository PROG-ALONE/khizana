<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="خِزانة">
<meta name="author" content="حيدر نصيف">
<meta name="description" content="خِزانة — إدارة الأموال الشخصية والعائلية · تصميم وتطوير حيدر نصيف">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>خِزانة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1e8; --surface:rgba(255,253,247,.86); --surface-solid:#fffdf7; --surface2:#efe8d8;
  --text:#1b1a14; --muted:#7a7462; --line:rgba(166,124,38,.18); --line-strong:rgba(166,124,38,.45);
  --gold:#a67c26; --gold1:#c99a3a; --gold2:#8a6418; --em:#0f6b4f;
  --income:#16855a; --expense:#b8392f; --warn:#c7811a; --blue:#3f6fc4; --violet:#7a52c9;
  --glow:0 10px 30px rgba(166,124,38,.18); --shadow:0 4px 18px rgba(60,45,10,.07);
  --goldtext:linear-gradient(120deg,#8a6418,#c99a3a 45%,#8a6418);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060d0b; --surface:rgba(255,255,255,.035); --surface-solid:#0f1a16; --surface2:rgba(255,255,255,.06);
  --text:#efeadb; --muted:#9a978a; --line:rgba(212,175,95,.13); --line-strong:rgba(212,175,95,.5);
  --gold:#d9b465; --gold1:#f3d68a; --gold2:#b8892f; --em:#22b083;
  --income:#3ccf8e; --expense:#f0706a; --warn:#f2ad45; --blue:#6f9cf0; --violet:#a98af0;
  --glow:0 10px 34px rgba(212,175,95,.16); --shadow:none;
  --goldtext:linear-gradient(120deg,#b8892f,#f6dc94 45%,#c99a3a);
}}
:root[data-theme="dark"]{
  --bg:#060d0b; --surface:rgba(255,255,255,.035); --surface-solid:#0f1a16; --surface2:rgba(255,255,255,.06);
  --text:#efeadb; --muted:#9a978a; --line:rgba(212,175,95,.13); --line-strong:rgba(212,175,95,.5);
  --gold:#d9b465; --gold1:#f3d68a; --gold2:#b8892f; --em:#22b083;
  --income:#3ccf8e; --expense:#f0706a; --warn:#f2ad45; --blue:#6f9cf0; --violet:#a98af0;
  --glow:0 10px 34px rgba(212,175,95,.16); --shadow:none;
  --goldtext:linear-gradient(120deg,#b8892f,#f6dc94 45%,#c99a3a);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(100px + env(safe-area-inset-bottom));min-height:100vh;
  background:radial-gradient(900px 500px at 100% -10%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 60%),
             radial-gradient(700px 500px at -10% 30%,color-mix(in srgb,var(--em) 12%,transparent),transparent 60%),var(--bg);
  background-attachment:fixed}
.app{max-width:480px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button,input,select,textarea{font-family:inherit;border:0;background:none;color:inherit}
button{cursor:pointer}
.kufi{font-family:'Noto Kufi Arabic',sans-serif}
.muted{color:var(--muted)} .strong{color:var(--text);font-weight:700}
.in{color:var(--income)} .out{color:var(--expense)}

/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 0 14px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo{width:42px;height:42px;border-radius:14px;background:var(--goldtext);display:grid;place-items:center;color:#1b1a14;
  font-family:'Noto Kufi Arabic',sans-serif;font-weight:800;font-size:20px;box-shadow:var(--glow)}
.hello small{color:var(--muted);font-size:12px;display:block}
.hello b{font-size:18px;font-family:'Noto Kufi Arabic',sans-serif}
.hbtns{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--surface);display:grid;place-items:center;
  border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:.3s}
.icon-btn:hover{border-color:var(--line-strong);color:var(--gold);transform:translateY(-2px)}
.icon-btn svg{width:20px;height:20px}
.month{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:6px;margin-bottom:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.month button{width:36px;height:36px;border-radius:11px;font-size:20px;color:var(--muted);transition:.25s}
.month button:hover{background:var(--surface2);color:var(--gold)}
.month span{font-weight:600;font-size:15px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:12px;padding:10px 14px;border-radius:14px;
  border:1px dashed var(--line-strong);color:var(--muted);margin-bottom:14px}

/* cards */
.card,.hero,.w,.tile,.kpi{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);position:relative;overflow:hidden}
.card::after,.hero::before{content:"";position:absolute;top:0;bottom:0;width:60%;right:-80%;
  background:linear-gradient(100deg,transparent,color-mix(in srgb,var(--gold1) 16%,transparent),transparent);
  transform:skewX(-18deg);pointer-events:none;transition:right .8s ease}
.card:not(.flat):hover,.card.act{transform:translateY(-4px);border-color:var(--line-strong);box-shadow:var(--glow)}
.card:not(.flat):hover::after,.card.act::after,.hero:hover::before{right:130%}
.card+.card{margin-top:10px}
.hero{border-radius:26px;padding:22px 20px 18px;position:relative;overflow:hidden;color:#f6efdc;
  background:radial-gradient(400px 200px at 0% 0%,rgba(243,214,138,.22),transparent 60%),linear-gradient(150deg,#0e3a2d 0%,#071a14 70%);
  border:1px solid rgba(243,214,138,.28);box-shadow:0 20px 50px rgba(5,30,22,.35)}
.hero:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 26px 60px rgba(5,30,22,.45),0 0 0 1px rgba(243,214,138,.45)}
.hero .pattern{position:absolute;inset:0;opacity:.07;pointer-events:none;background-image:repeating-linear-gradient(45deg,#f3d68a 0 1px,transparent 1px 14px)}
.hero small{opacity:.78;font-size:13px}
.hero .big{font-size:34px;font-weight:800;margin:6px 0 2px;font-family:'Noto Kufi Arabic',sans-serif;line-height:1.35;
  background:linear-gradient(120deg,#d9b465,#fff1c4 45%,#d9b465);-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:200% auto;animation:sheen 6s linear infinite}
@keyframes sheen{to{background-position:200% center}}
.hero .big em{font-style:normal;font-size:15px;font-weight:600}
.hero .usd{opacity:.8;font-size:14px}
.hero .rate{position:absolute;top:18px;left:18px;font-size:11px;background:rgba(243,214,138,.12);border:1px solid rgba(243,214,138,.3);color:#f3d68a;padding:4px 10px;border-radius:20px}
.hero .bar{background:rgba(255,255,255,.1)}
.hero .bar i{background:linear-gradient(90deg,#b8892f,#f3d68a)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;position:relative}
.stat{background:rgba(255,255,255,.06);border:1px solid rgba(243,214,138,.14);border-radius:16px;padding:10px;transition:.3s;min-width:0}
.stat:hover{background:rgba(243,214,138,.12);transform:translateY(-2px)}
.stat small{font-size:11px;opacity:.75;display:block}
.stat b{font-size:13.5px;display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sec{margin-top:24px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.sec-h h2{font-size:16px;font-weight:700;font-family:'Noto Kufi Arabic',sans-serif;display:flex;align-items:center;gap:8px}
.sec-h h2::before{content:"";width:4px;height:16px;border-radius:4px;background:var(--goldtext)}
.sec-h a,.link{font-size:13px;color:var(--gold);text-decoration:none;font-weight:600;cursor:pointer}
.sec-h h2{min-width:0;flex:1 1 auto;line-height:1.5}
.sec-h>a,.sec-h>button{flex:0 0 auto;white-space:nowrap}
.sec-h h2{display:block;overflow-wrap:anywhere}.sec-h h2::before{display:inline-block;vertical-align:-2px;margin-left:8px}.sec-h h2 small{white-space:normal}
main{overflow-x:clip}
.page-title{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px;gap:8px}
.page-title h1{font-size:22px;font-family:'Noto Kufi Arabic',sans-serif}
.ph-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.back{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;margin-bottom:6px;cursor:pointer}

/* wallets */
.wallets{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:6px 16px 14px;scrollbar-width:none;perspective:900px}
.wallets::-webkit-scrollbar{display:none}
.w{flex:0 0 200px;scroll-snap-align:start;border-radius:20px;padding:16px;color:#fff;min-height:130px;display:flex;flex-direction:column;
  justify-content:space-between;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 24px rgba(0,0,0,.18);cursor:pointer}
.w::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);top:-60px;left:-40px}
.w::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 48%,transparent 62%);transform:translateX(120%);transition:transform .8s;pointer-events:none}
.w:hover{transform:translateY(-6px) rotateX(6deg) rotateY(-6deg);box-shadow:0 18px 34px rgba(0,0,0,.28)}
.w:hover::after{transform:translateX(-120%)}
.w .t{display:flex;justify-content:space-between;align-items:center;position:relative}
.chip{width:30px;height:22px;border-radius:5px;background:linear-gradient(135deg,#f3d68a,#b8892f);position:relative;opacity:.9}
.chip::after{content:"";position:absolute;inset:5px 8px;border:1px solid rgba(0,0,0,.25);border-radius:2px}
.w .cur{font-size:10px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:10px}
.w b{font-size:20px;position:relative}
.w small{font-size:11px;opacity:.82;position:relative}
.w .mini{height:3px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:6px;overflow:hidden;position:relative}
.w .mini i{display:block;height:100%;background:#f3d68a;border-radius:3px;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.w.add{background:var(--surface);color:var(--muted);border:1.5px dashed var(--line-strong);align-items:center;justify-content:center;gap:6px;font-size:13px;box-shadow:none}
.w.add::before,.w.add::after{display:none}
.wlist .w{flex:none;width:100%;min-height:118px}
.wlist .w+.w{margin-top:12px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 6px;text-align:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:13px;font-weight:600}
.tile .ti{width:42px;height:42px;border-radius:14px;margin:0 auto 8px;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold);transition:.35s}
.tile .ti svg{width:22px;height:22px}
.tile small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.tile:hover{transform:translateY(-4px);border-color:var(--line-strong);box-shadow:var(--glow)}
.tile:hover .ti{background:var(--goldtext);color:#1b1a14;transform:rotate(-8deg) scale(1.08)}

/* bars & rows */
.bar{height:8px;background:var(--surface2);border-radius:8px;overflow:hidden;margin:9px 0 6px}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--em),color-mix(in srgb,var(--em) 60%,var(--gold1)));transition:width 1.3s cubic-bezier(.2,.8,.2,1);position:relative}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:flow 2.4s infinite;background-size:50% 100%;background-repeat:no-repeat}
@keyframes flow{0%{background-position:-60% 0}100%{background-position:160% 0}}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px}
.row+.row{margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .card+.card{margin-top:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.badge{font-size:11px;padding:3px 9px;border-radius:10px;background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--gold);font-weight:600;white-space:nowrap;display:inline-block}
.badge.em{background:color-mix(in srgb,var(--em) 15%,transparent);color:var(--em)}
.badge.red{background:color-mix(in srgb,var(--expense) 14%,transparent);color:var(--expense)}
.badge.gray{background:var(--surface2);color:var(--muted)}
button.badge{cursor:pointer;transition:.25s;border:1px solid transparent}
button.badge:hover{border-color:currentColor}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0}
.kpi:hover{transform:translateY(-3px);border-color:var(--line-strong)}
.kpi small{font-size:11px;color:var(--muted);display:block}
.kpi b{font-size:16px;display:block;margin-top:4px;font-family:'Noto Kufi Arabic',sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* list rows */
.li{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;transition:.25s;border-radius:12px}
.li+.li{border-top:1px solid var(--line)}
.li:hover{background:var(--surface2);padding-inline:8px}
.li .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:17px;background:var(--surface2);flex:0 0 40px}
.li .info{flex:1;min-width:0}
.li .info b{font-size:14px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .info small{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .v{font-weight:700;font-size:14px;text-align:left;white-space:nowrap}
.li .bar{height:5px;margin:6px 0 0}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#1b1a14;background:var(--goldtext);flex:0 0 38px}
.av.sm{width:32px;height:32px;font-size:12px;flex:0 0 32px}
.share{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);margin-inline-start:6px}
.tag{font-size:10px;padding:2px 7px;border-radius:8px;background:var(--surface2);color:var(--muted);font-weight:600;margin-inline-start:4px}
.fam-list{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:4px 16px 10px;scrollbar-width:none}
.fam-list::-webkit-scrollbar{display:none}
.fam-list .card{flex:0 0 170px;padding:14px;margin-top:0!important}

/* goals ring */
.goal{display:flex;gap:14px;align-items:center;cursor:pointer}
.goal+.goal{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.ring{width:58px;height:58px;flex:0 0 58px}
.ring .p{transition:stroke-dashoffset 1.5s cubic-bezier(.2,.8,.2,1)}
.goal h3{font-size:14px;font-weight:600}
.goal p{font-size:12px;color:var(--muted);margin-top:2px}

/* chips & seg */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px;gap:2px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);transition:.25s}
.seg button.on{background:var(--goldtext);color:#1b1a14}
.mini-btn{font-size:12px;padding:7px 11px;border-radius:11px;border:1px solid var(--line-strong);color:var(--gold);font-weight:600;transition:.25s;white-space:nowrap}
.mini-btn:hover,.mini-btn.gold{background:var(--goldtext);color:#1b1a14;border-color:transparent}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:15px;font-weight:700;font-size:14px;transition:.3s}
.btn.gold{background:var(--goldtext);color:#1b1a14;box-shadow:var(--glow)}
.btn.gold:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn.ghost{border:1px solid var(--line-strong);color:var(--gold)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--expense);border:1px solid color-mix(in srgb,var(--expense) 40%,transparent)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btns.three{grid-template-columns:1fr 1fr 1fr}
.checks{display:flex;flex-direction:column;gap:6px}
.checks div{font-size:12px;display:flex;gap:6px;align-items:center}
.checks .ok{color:var(--em)} .checks .bad{color:var(--expense)}
.recv{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.recv span{font-size:12px;padding:3px 9px;border-radius:14px;background:color-mix(in srgb,var(--gold) 10%,transparent);border:1px solid var(--line)}
.turn{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer;border-radius:12px;transition:.25s}
.turn+.turn{border-top:1px solid var(--line)}
.turn:hover{background:var(--surface2);padding-inline:6px}
.turn.sel{background:color-mix(in srgb,var(--gold) 16%,transparent);padding-inline:6px}
.turn .no{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);flex:0 0 34px}
.turn.done .no{background:color-mix(in srgb,var(--em) 20%,transparent);color:var(--em)}
.turn.now .no{background:var(--goldtext);color:#1b1a14}
.turn .info{flex:1;min-width:0}
.turn .info b{font-size:13px}
.turn .info small{font-size:12px;color:var(--muted);margin-inline-start:6px}
.mem{display:flex;align-items:center;gap:10px;padding:10px 0}
.mem+.mem{border-top:1px solid var(--line)}
.mem .info{flex:1;min-width:0;cursor:pointer}
.mem .info b{font-size:14px;display:block}
.mem .info small{font-size:11px;color:var(--muted);display:block;line-height:1.6}
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mc{padding:9px 2px;border-radius:11px;text-align:center;font-size:11px;background:var(--surface2);color:var(--muted);font-weight:700;cursor:pointer;transition:.25s;line-height:1.4}
.mc:hover{transform:translateY(-2px)}
.mc.on{background:color-mix(in srgb,var(--em) 24%,transparent);color:var(--em)}
.mc.recv{background:var(--goldtext);color:#1b1a14}
.mc.now{outline:1.5px solid var(--gold);outline-offset:1px}

/* building */
.bld{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;margin-top:12px}
.u{aspect-ratio:1;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;
  border:1px solid var(--line);background:var(--surface2);transition:transform .3s,box-shadow .3s;cursor:pointer;color:var(--muted);text-align:center;padding:4px;line-height:1.3}
.u span{font-size:19px}
.u:hover{transform:translateY(-3px) scale(1.05);box-shadow:var(--glow)}
.u.paid{background:color-mix(in srgb,var(--em) 20%,transparent);border-color:color-mix(in srgb,var(--em) 45%,transparent);color:var(--em)}
.u.late{background:color-mix(in srgb,var(--expense) 16%,transparent);border-color:color-mix(in srgb,var(--expense) 45%,transparent);color:var(--expense)}
.u.pending{background:color-mix(in srgb,var(--gold) 14%,transparent);border-color:var(--line-strong);color:var(--gold)}
.u.vacant{opacity:.6;border-style:dashed}
.u.setup{border-style:dashed;border-color:color-mix(in srgb,var(--blue) 55%,transparent);color:var(--blue);background:color-mix(in srgb,var(--blue) 8%,transparent)}
.u.addu{border-style:dashed;color:var(--gold)}
.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:none;opacity:1}}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap;margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .b{transform-origin:center bottom;transform-box:fill-box;transform:scaleY(0);transition:transform 1.1s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.chart .b:hover{opacity:.8}
.chart text{fill:var(--muted);font-size:9px;font-family:'IBM Plex Sans Arabic',sans-serif}
.chart .gl{stroke:var(--line);stroke-width:.6}
.donut-wrap{display:flex;align-items:center;gap:14px}
.donut{width:118px;height:118px;flex:0 0 118px}
.donut .s{transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.dl{flex:1;display:flex;flex-direction:column;gap:7px;font-size:12px;min-width:0}
.dl div{display:flex;align-items:center;gap:6px}
.dl span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl b{margin-inline-start:auto;font-weight:700}
.empty{text-align:center;padding:26px 16px}
.empty .ei{font-size:26px;color:var(--gold)}
.empty p{color:var(--muted);font-size:13px;margin:6px 0 12px;line-height:1.7}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;padding:0 12px calc(10px + env(safe-area-inset-bottom));z-index:20;pointer-events:none}
nav .in-nav{max-width:420px;margin:0 auto;display:grid;grid-template-columns:1fr 1.2fr 1fr;align-items:end;pointer-events:auto;
  background:color-mix(in srgb,var(--surface-solid) 84%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--line);border-radius:24px;padding:8px 6px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 0;transition:.25s}
nav button svg{width:22px;height:22px;transition:.3s}
nav button:hover svg{transform:translateY(-2px)}
nav button.on{color:var(--gold);font-weight:700}
nav .fab{width:56px;height:56px;border-radius:19px;background:var(--goldtext);color:#1b1a14;margin:-30px auto 0;display:grid;place-items:center;box-shadow:0 8px 22px rgba(201,154,58,.45);transition:.35s}
nav .fab:hover{transform:scale(1.06)}
nav .fab svg{width:26px;height:26px}
#view{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.note{font-size:12px;color:var(--muted);text-align:center;margin:22px 0 8px;line-height:1.7}

/* sheet & forms */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet-wrap.on{display:flex;animation:fade .25s}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--surface-solid);border:1px solid var(--line);border-radius:26px 26px 0 0;
  padding:12px 18px calc(22px + env(safe-area-inset-bottom));animation:up .35s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(50px);opacity:.3}}
.grab{width:44px;height:5px;border-radius:5px;background:var(--surface2);margin:0 auto 12px}

.f{margin-top:13px}
.f>label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;font-weight:600}
.f input:not([type=checkbox]),.f select,.f textarea{width:100%;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:16px;color:var(--text);-webkit-appearance:none;appearance:none}
.f select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:18px 50%,13px 50%;background-size:5px 5px;background-repeat:no-repeat}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--line-strong)}
.f .hint{font-size:11px;color:var(--muted);margin-top:5px;min-height:0}
.amt-in{font-size:30px!important;font-weight:800;text-align:center;font-family:'Noto Kufi Arabic',sans-serif!important}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{padding:8px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
.chipsel button.on{background:var(--goldtext);color:#1b1a14;border-color:transparent}
.chipsel.colors button{width:34px;height:34px;padding:0;border-radius:11px}

.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}

.kv b{font-size:14px}
.toast{position:fixed;bottom:118px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-solid);border:1px solid var(--line-strong);color:var(--text);
  padding:10px 18px;border-radius:14px;font-size:13px;font-weight:600;opacity:0;transition:.3s;z-index:90;box-shadow:var(--glow);pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* settings */
.set{display:flex;align-items:center;justify-content:space-between;padding:13px 0;gap:10px}
.set+.set{border-top:1px solid var(--line)}
.set b{font-size:14px;display:block}
.set small{font-size:12px;color:var(--muted)}
.opt{display:flex;background:var(--surface2);border-radius:11px;padding:3px;flex-wrap:wrap}

.inp{width:110px;padding:8px 10px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);text-align:center;font-weight:700;font-size:15px;color:var(--text)}
.inp:focus{outline:none;border-color:var(--line-strong)}

/* report viewer */
.rview{position:fixed;inset:0;z-index:70;background:#e9e5da;overflow:auto;display:none;-webkit-overflow-scrolling:touch}
.rview.on{display:block;animation:fade .3s}
.rbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#0e2a21;color:#f6efdc}
.rbar b{flex:1;font-size:14px;font-family:'Noto Kufi Arabic',sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar .x{background:rgba(255,255,255,.1);color:#f6efdc}
.rbar .mini-btn{border-color:rgba(243,214,138,.5);color:#f3d68a}
.rbar .mini-btn.gold{color:#1b1a14}
.paper{max-width:794px;margin:14px auto 40px;background:#fff;color:#151515;padding:26px 22px;direction:rtl;font-family:'IBM Plex Sans Arabic',sans-serif;box-shadow:0 6px 30px rgba(0,0,0,.12)}
.paper *{color:inherit}
.rp-head{display:flex;align-items:center;gap:14px;border-bottom:3px solid #b8892f;padding-bottom:14px}
.rp-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#8a6418,#e0b453);display:grid;place-items:center;font-family:'Noto Kufi Arabic',sans-serif;font-weight:800;font-size:26px;color:#1b1a14!important}

.rp-head p{font-size:11px;color:#6b6b6b!important;margin-top:3px}

.rp-kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.rp-kv div{background:#f6f2e7;border-radius:8px;padding:7px 9px}
.rp-kv span{display:block;font-size:10px;color:#7a7462!important}
.rp-kv b{font-size:12.5px}
.paper table{width:100%;border-collapse:collapse;font-size:10.5px}
.paper th{background:#0e3a2d;color:#f3d68a!important;padding:6px 5px;font-weight:600;text-align:right}
.paper td{border-bottom:1px solid #ece6d6;padding:5px;text-align:right}
.paper tr:nth-child(even) td{background:#faf8f2}
.paper tfoot td{font-weight:700;background:#f3ecd9!important;border-top:2px solid #b8892f}
.paper tr{page-break-inside:avoid}
.paper .num{direction:ltr;unicode-bidi:isolate}
.rp-bar{display:flex;align-items:center;gap:8px;font-size:11px;margin:3px 0}
.rp-bar span{width:120px;flex:0 0 120px}
.rp-bar i{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,#0f6b4f,#c99a3a)}
.rp-bar b{margin-inline-start:6px}
.rp-foot{margin-top:24px;font-size:10px;color:#8a8a8a!important;text-align:center;border-top:1px solid #eee;padding-top:10px}
.ok-c{color:#0f6b4f!important;font-weight:700} .cov-c{color:#a67c26!important;font-weight:700} .no-c{color:#b8392f!important;font-weight:700}

  #rview{position:static;display:block;background:#fff;overflow:visible}
  .rbar{display:none}
  .paper{box-shadow:none;margin:0;max-width:none}
}

<div class="sheet-wrap" id="sheet"><div class="sheet"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div class="rview" id="rview">
  <div class="rbar"><button class="x" data-act="rclose" aria-label="إغلاق">✕</button><b id="rtitle">تقرير</b>
    <button class="mini-btn" data-act="rxlsx">📊 Excel</button><button class="mini-btn gold" data-act="rpdf">📄 PDF</button></div>
  <div class="paper" id="rpaper"></div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   خِزانة — core: utils, state, aggregates, UI kit, charts, router
   ===================================================================== */
const APP='خِزانة', LS='khizana_v1', APP_VER='1', APP_DATE='تشرين الأول 2026', DEV='حيدر نصيف', DEV_URL='https://github.com/PROG-ALONE';
const SIGN=`${APP} · الإصدار ${APP_VER} · تصميم وتطوير ${DEV}`;
try{console.log('%c'+APP+' v'+APP_VER+' — تصميم وتطوير '+DEV,'color:#c99a3a;font-weight:bold;font-size:13px')}catch(e){}
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const MONTHS=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=()=>ymd(new Date());
const NOWK=()=>TODAY().slice(0,7);
const mkey=(y,m)=>`${y}-${pad(m)}`;
const parseD=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addM=(y,m,n)=>{const k=y*12+(m-1)+n;return [Math.floor(k/12),k%12+1]};
const monthRange=(y,m)=>[mkey(y,m)+'-01',mkey(y,m)+'-'+pad(new Date(y,m,0).getDate())];
const inRange=(d,f,t)=>d>=f&&d<=t;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normNum=s=>String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٬,\s]/g,'').replace('٫','.');
const toNum=s=>{const n=parseFloat(normNum(s));return isFinite(n)?n:0};
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- digits & money ---------- */
const toAr=s=>String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]).replace(/,/g,'٬').replace(/\./g,'٫');
const dg=s=>(S&&S.settings.digits==='ar')?toAr(s):String(s);
const fmtN=(n,dec=0)=>dg(Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:dec}));
const money=(n,cur='IQD')=>{n=+n||0;const s=n<0?'−':'';return cur==='USD'?s+'$'+fmtN(Math.abs(n),2):s+fmtN(Math.abs(n))};
const mLabel=(y,m)=>MONTHS[m-1]+' '+dg(y);
const mShort=(y,m)=>MONTHS[m-1].replace('كانون ','ك').replace('تشرين ','ت').replace('الثاني','٢').replace('الأول','١');
const dLabel=s=>{if(!s)return '';const d=parseD(s);return dg(d.getDate())+' '+MONTHS[d.getMonth()]};
const dLabelY=s=>{if(!s)return '';const d=parseD(s);return dg(d.getDate())+' '+MONTHS[d.getMonth()]+' '+dg(d.getFullYear())};
const kLabel=k=>{const [y,m]=k.split('-').map(Number);return mLabel(y,m)};

/* ---------- state ---------- */
let S=null;
const CAT_DEF=[
  ['e_home','تسوق البيت','🛒','expense','need'],['e_fuel','بنزين وسيارة','⛽','expense','need'],['e_food','مطاعم وطلعات','🍽️','expense','want'],
  ['e_health','صحة وعلاج','💊','expense','need'],['e_tel','اتصالات وإنترنت','📱','expense','need'],['e_bills','فواتير ومولدة','💡','expense','need'],
  ['e_cloth','ملابس','👕','expense','want'],['e_edu','تعليم','📚','expense','need'],['e_family','العائلة','👨‍👩‍👦','expense','need'],
  ['e_gift','هدايا ومناسبات','🎁','expense','want'],['e_sadaqa','صدقات','🤲','expense','need'],['e_zakat','زكاة','🕌','expense','need'],['e_fix','صيانة','🔧','expense','need'],['e_other','أخرى','📦','expense','want'],
  ['i_salary','الراتب','💼','income',''],['i_rent','إيجارات العقارات','🏢','income',''],['i_car','عائد السيارة','🚗','income',''],
  ['i_stock','أرباح الأسهم','📈','income',''],['i_other','دخل آخر','💰','income','']];
function blank(){return {v:1,demo:false,lastWallet:null,
  settings:{rate:1450,digits:'en',theme:'auto',budget:'free',user:'',sadaqaPct:0,sadaqaBase:'income'},
  zakat:{base:'gold',goldPrice:0,silverPrice:0,priceDate:'',hawlStart:'',jewelry:false,deduct:true,receivables:true,jam:true,goals:true,trade:0,otherCash:0,silverGrams:0,gold:[],history:[]},
  wallets:[],cats:CAT_DEF.map(([id,name,icon,kind,group])=>({id,name,icon,kind,group,limit:0})),
  tx:[],commits:[],people:[],jams:[],props:[],invs:[],debts:[],goals:[]}}
function load(){try{S=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){S=null}
  if(!S||!S.settings){S=blank()}
  else if(S.demo){const st=S.settings;S=blank();S.settings={...S.settings,...st,user:''};S.zakat=blank().zakat}
  normalize(); save()}
function normalize(){const b=blank();for(const k in b) if(S[k]===undefined) S[k]=b[k];
  for(const k in b.settings) if(S.settings[k]===undefined) S.settings[k]=b.settings[k];
  for(const k in b.zakat) if(S.zakat[k]===undefined) S.zakat[k]=b.zakat[k];
  b.cats.forEach(c=>{if(!S.cats.some(x=>x.id===c.id))S.cats.push(c)});
  S.people.forEach(p=>{if(!p.group)p.group='family'});
  S.jams.forEach(j=>{if(j.mode==='manage'){j.members=j.members||[];j.turns=j.turns||[];j.pay=j.pay||{};j.delivered=j.delivered||{};j.cover=j.cover||{};while(j.turns.length<j.months)j.turns.push([])}})}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('تعذّر الحفظ على الجهاز')}}

/* ---------- lookups ---------- */
const wById=id=>S.wallets.find(w=>w.id===id);
const catById=id=>S.cats.find(c=>c.id===id);
const personById=id=>S.people.find(p=>p.id===id);
const jamById=id=>S.jams.find(j=>j.id===id);
const propById=id=>S.props.find(p=>p.id===id);
const invById=id=>S.invs.find(p=>p.id===id);
const debtById=id=>S.debts.find(p=>p.id===id);
const goalById=id=>S.goals.find(p=>p.id===id);
const commitById=id=>S.commits.find(p=>p.id===id);
const catOpts=kind=>S.cats.filter(c=>c.kind===kind).map(c=>[c.id,`${c.icon} ${c.name}`]);
const walletOpts=()=>S.wallets.map(w=>[w.id,`${w.name} (${w.currency==='USD'?'$':'د.ع'})`]);
const lastWallet=()=>(S.lastWallet&&wById(S.lastWallet))?S.lastWallet:(S.wallets[0]||{}).id;
const refIs=(t,kind,o={})=>t.ref&&t.ref.kind===kind&&Object.keys(o).every(k=>t.ref[k]===o[k]);

/* ---------- money aggregates ---------- */
const IN_TYPES=['income','unsave','borrow','collect'];
const TYPE_L={expense:'مصروف',income:'دخل',transfer:'تحويل',save:'ادخار',unsave:'سحب من الادخار',lend:'إقراض',borrow:'استدانة',collect:'تحصيل دين',repay:'تسديد دين'};
const toIQD=(n,cur)=>cur==='USD'?n*S.settings.rate:n;
const fromIQD=(n,cur)=>cur==='USD'?Math.round(n/S.settings.rate*100)/100:n;
const curOf=t=>{const w=wById(t.walletId);return w?w.currency:'IQD'};
const txIQD=t=>toIQD(+t.amount||0,curOf(t));
function walletDelta(t,wid){let d=0;if(t.walletId===wid)d+=(IN_TYPES.includes(t.type)?1:-1)*(+t.amount||0);
  if(t.type==='transfer'&&t.toWalletId===wid)d+=+(t.toAmount??t.amount)||0;return d}
const bal=(w,upto)=>(+w.opening||0)+sum(S.tx.filter(t=>!upto||t.date<=upto),t=>walletDelta(t,w.id));
const totalBalance=()=>sum(S.wallets,w=>toIQD(bal(w),w.currency));
const monthEnd=()=>monthRange(...VM)[1];
const isCurMonth=()=>mkey(...VM)===NOWK();
const balAt=(w,d)=>d>=TODAY()?bal(w):bal(w,d);
const totalAt=d=>sum(S.wallets,w=>toIQD(balAt(w,d),w.currency));
const sumTx=pred=>sum(S.tx.filter(pred),txIQD);
function totals(f,t){const r=x=>inRange(x.date,f,t);
  return {income:sumTx(x=>r(x)&&x.type==='income'),expense:sumTx(x=>r(x)&&x.type==='expense'),
    save:sumTx(x=>r(x)&&x.type==='save'),unsave:sumTx(x=>r(x)&&x.type==='unsave')}}
const lastMonths=(y,m,n)=>Array.from({length:n},(_,i)=>addM(y,m,i-n+1));
function addTx(o){const t={id:uid(),date:TODAY(),note:'',...o};S.tx.push(t);return t}
function removeTx(id){const t=S.tx.find(x=>x.id===id);if(!t)return;
  if(t.ref&&t.ref.kind==='jamme'){const j=jamById(t.ref.id);if(j&&j.pay[t.ref.idx])delete j.pay[t.ref.idx][t.ref.mid]}
  if(t.ref&&t.ref.kind==='jamrecv'){const j=jamById(t.ref.id);if(j)delete j.delivered[t.ref.idx]}
  S.tx=S.tx.filter(x=>x.id!==id)}

/* ---------- UI kit ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2300)}
function openSheet(html){$('#sheetBody').innerHTML=html;$('#sheet').classList.add('on');$('#sheet .sheet').scrollTop=0}
function closeSheet(){$('#sheet').classList.remove('on');FORM=null}
const sheetHead=t=>`<div class="sh-h"><h3>${t}</h3><button class="x" data-act="close" aria-label="إغلاق">✕</button></div>`;
const cnt=(v,o={})=>`<span class="num" data-count="${+v||0}"${o.pre?` data-pre="${o.pre}"`:''}${o.suf?` data-suf="${o.suf}"`:''}${o.dec?` data-dec="${o.dec}"`:''}>0</span>`;
const cntM=(v,cur='IQD')=>cur==='USD'?cnt(v,{pre:'$',dec:2}):cnt(v);
const nm=v=>`<span class="num">${v}</span>`;
const barH=(p,color)=>`<div class="bar"><i data-w="${clamp(+p||0,0,100).toFixed(1)}"${color?` style="background:${color}"`:''}></i></div>`;
const sec=(title,link,body)=>`<div class="sec"><div class="sec-h"><h2>${title}</h2>${link||''}</div>${body}</div>`;
const lnk=(label,act,attrs='')=>`<a class="link" data-act="${act}" ${attrs}>${label}</a>`;
const kpi=(label,val,cls='')=>`<div class="kpi"><small>${label}</small><b class="${cls}">${val}</b></div>`;
const empty=(msg,act,label)=>`<div class="card flat empty"><div class="ei">✦</div><p>${msg}</p>${act?`<button class="mini-btn" data-act="${act}">＋ ${label}</button>`:''}</div>`;
const repBtn=(scope,id)=>`<button class="mini-btn" data-act="report" data-s="${scope}"${id?` data-id="${id}"`:''}>📄 تقرير</button>`;
const pageHead=(title,btns='')=>`<div class="page-title"><h1>${title}</h1><div class="ph-btns">${btns}</div></div>`;
const backTo=(v,label,p)=>`<a class="back" data-act="go" data-v="${v}"${p?` data-p="${p}"`:''}>→ ${label}</a>`;
const monthBar=()=>`<div class="month"><button data-act="mprev" aria-label="الشهر السابق">›</button><span>${mLabel(VM[0],VM[1])}</span><button data-act="mnext" aria-label="الشهر التالي">‹</button></div>`;
const PAL=['var(--em)','var(--gold)','var(--blue)','var(--expense)','var(--violet)','var(--warn)','#3fb8c4','#c45a9b','#8aa13f','#9a8f78'];
const WCOLORS=['#0f5e46','#1f3768','#6e2a55','#6b5216','#7a2e2e','#2d5c63','#4b3a78','#3d4a2a','#3a3a3a'];
const shade=(h,p=.55)=>{const n=parseInt(String(h).replace('#',''),16);if(isNaN(n))return h;const f=c=>Math.round(c*(1-p));return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`};

/* ---------- form builder ---------- */
let FORM=null;
function field(x,val){
  const id='f_'+x.k, hint=x.hint?`<div class="hint">${x.hint}</div>`:'';
  let inner='';
  switch(x.type){
    case 'amount': inner=`<input id="${id}" name="${x.k}" class="amt-in num" inputmode="decimal" data-amt value="${val??''}" placeholder="0"${x.focus?' autofocus':''}><div class="hint num"></div>`;break;
    case 'number': inner=`<input id="${id}" name="${x.k}" class="num" inputmode="decimal" data-amt value="${val??''}" placeholder="${esc(x.ph||'')}"><div class="hint num"></div>`;break;
    case 'int': inner=`<input id="${id}" name="${x.k}" class="num" inputmode="numeric" value="${val??''}" placeholder="${esc(x.ph||'')}">`;break;
    case 'date': inner=`<input id="${id}" name="${x.k}" type="date" value="${val===undefined?TODAY():esc(val)}">`;break;
    case 'month': inner=`<input id="${id}" name="${x.k}" type="month" value="${esc(val||NOWK())}">`;break;
    case 'select': inner=`<select id="${id}" name="${x.k}">${x.options.map(([v,l])=>`<option value="${esc(v)}"${String(v)===String(val??'')?' selected':''}>${esc(l)}</option>`).join('')}</select>`;break;
    case 'chips': case 'colors':{const sel=(x.multi?(val||[]):[val]).map(String);
      inner=`<div class="chipsel${x.type==='colors'?' colors':''}" data-k="${x.k}"${x.multi?' data-multi="1"':''}>${x.options.map(([v,l])=>`<button type="button" data-v="${esc(v)}" class="${sel.includes(String(v))?'on':''}"${x.type==='colors'?` style="background:${v}" aria-label="لون"`:''}>${x.type==='colors'?'':l}</button>`).join('')}</div>`;break}
    case 'check': return `<div class="f" data-f="${x.k}"${x.hide?' style="display:none"':''}><label class="check"><input type="checkbox" name="${x.k}"${val?' checked':''}> ${esc(x.label)}</label>${hint}</div>`;
    case 'textarea': inner=`<textarea id="${id}" name="${x.k}" rows="2" placeholder="${esc(x.ph||'')}">${esc(val||'')}</textarea>`;break;
    case 'list': inner=`<input id="${id}" name="${x.k}" list="${id}_l" value="${esc(val??'')}" placeholder="${esc(x.ph||'')}"><datalist id="${id}_l">${(x.options||[]).map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`;break;
    case 'html': return `<div class="f" data-f="${x.k}">${x.html}</div>`;
    case 'password': inner=`<input id="${id}" name="${x.k}" type="password" autocomplete="off" value="${esc(val??'')}" placeholder="${esc(x.ph||'')}">`;break;
    default: inner=`<input id="${id}" name="${x.k}" value="${esc(val??'')}" placeholder="${esc(x.ph||'')}"${x.focus?' autofocus':''}>`;
  }
  return `<div class="f" data-f="${x.k}"${x.hide?' style="display:none"':''}><label for="${id}">${esc(x.label)}</label>${inner}${hint}</div>`;
}
function readForm(fields){const fr=$('#frm'),o={};
  for(const x of fields){if(!x||x.type==='html')continue;const el=fr.elements[x.k];
    if(x.type==='chips'||x.type==='colors'){const c=fr.querySelector(`.chipsel[data-k="${x.k}"]`);const on=$$('button.on',c).map(b=>b.dataset.v);o[x.k]=x.multi?on:(on[0]??'')}
    else if(x.type==='check')o[x.k]=!!(el&&el.checked);
    else if(['amount','number','int'].includes(x.type))o[x.k]=(!el||el.value.trim()==='')?'':toNum(el.value);
    else o[x.k]=el?el.value.trim():''}
  return o}
const showF=(k,on)=>{const f=$(`#frm [data-f="${k}"]`);if(f)f.style.display=on?'':'none'};
const visF=k=>{const f=$(`#frm [data-f="${k}"]`);return !!f&&f.style.display!=='none'};
function form(o){
  const fields=o.fields.filter(Boolean); o.fields=fields; const v=o.values||{};
  openSheet(`${sheetHead(esc(o.title))}${o.top||''}<form id="frm" autocomplete="off" novalidate>${fields.map(x=>field(x,v[x.k])).join('')}
    <button class="btn gold" style="margin-top:18px" type="submit">${o.submit||'حفظ'}</button>
    ${o.danger?`<button class="btn danger" type="button" data-act="formDanger" style="margin-top:8px">${o.danger.label}</button>`:''}</form>`);
  FORM=o; const fr=$('#frm');
  fr.addEventListener('click',e=>{const b=e.target.closest('.chipsel button');if(!b)return;e.preventDefault();const c=b.parentElement;
    if(c.dataset.multi)b.classList.toggle('on');else $$('button',c).forEach(x=>x.classList.toggle('on',x===b));
    fr.dispatchEvent(new Event('change'))});
  fr.addEventListener('input',e=>{const i=e.target;if(i.dataset&&i.dataset.amt!==undefined){const h=i.nextElementSibling;if(h)h.textContent=i.value?('= '+fmtN(toNum(i.value),2)):''}});
  $$('input[data-amt]',fr).forEach(i=>{const h=i.nextElementSibling;if(h&&i.value)h.textContent='= '+fmtN(toNum(i.value),2)});
  if(o.onInput){const h=()=>o.onInput(readForm(fields),fr);fr.addEventListener('input',h);fr.addEventListener('change',h)}
  fr.onsubmit=e=>{e.preventDefault();const vals=readForm(fields);
    for(const x of fields){if(!x.req||!visF(x.k))continue;const val=vals[x.k];
      if(val===''||val==null||(Array.isArray(val)&&!val.length)||(['amount','number','int'].includes(x.type)&&!(val>0))){toast('أكمل: '+x.label);return}}
    if(o.onSave(vals)!==false)closeSheet()};
  if(o.after)o.after(fr);
  if(o.onInput)o.onInput(readForm(fields),fr);
}
function pickWallet(title,amountIQD,cb,def,defDate){
  if(!S.wallets.length){toast('أضف محفظة أولاً');return}
  form({title,fields:[{k:'w',label:'المحفظة',type:'select',options:walletOpts()},{k:'date',label:'التاريخ',type:'date'}],
    values:{w:def||lastWallet(),date:defDate||TODAY()},top:amountIQD!=null?`<div class="kv"><div style="grid-column:1/-1"><small>المبلغ</small><b class="num">${money(amountIQD)} د.ع</b></div></div>`:'',
    submit:'تأكيد',onSave:v=>{cb(v.w,v.date);}})
}

/* ---------- charts ---------- */
function barChart(data,series,o={}){
  const W=320,H=o.h||150,pb=20,pt=8,ih=H-pb-pt;
  const max=Math.max(1,...data.flatMap(d=>d.v));
  const n=Math.max(1,data.length),gw=W/n,k=series.length,bw=Math.min(o.bw||16,(gw-10)/k-2);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for(let i=1;i<=3;i++){const y=pt+ih*(1-i/3);s+=`<line class="gl" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`}
  data.forEach((d,i)=>{const tot=k*bw+(k-1)*3,x0=i*gw+(gw-tot)/2;
    d.v.forEach((v,j)=>{const h=Math.max(ih*(v/max),v>0?1.5:0);
      s+=`<rect class="b" data-act="tip" data-t="${esc(d.l+' · '+series[j].name+': '+money(v,o.cur))}" x="${(x0+j*(bw+3)).toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${series[j].color}" style="transition-delay:${(i*60+j*30)}ms"/>`});
    s+=`<text x="${(i*gw+gw/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${esc(d.l)}</text>`});
  s+='</svg>';
  if(k>1)s+=`<div class="legend" style="justify-content:center">${series.map(x=>`<span><i class="dot" style="background:${x.color}"></i>${x.name}</span>`).join('')}</div>`;
  return s}
function donut(segs,o={}){
  segs=segs.filter(s=>s.v>0);const tot=sum(segs,s=>s.v);
  if(!tot)return `<p class="muted" style="font-size:13px;text-align:center;padding:14px">لا توجد بيانات لهذه الفترة</p>`;
  let off=0,c='';segs.forEach((s,i)=>{const p=s.v/tot*100;
    c+=`<circle class="s" data-act="tip" data-t="${esc(s.l+': '+money(s.v,o.cur)+' ('+fmtN(p,1)+'%)')}" cx="21" cy="21" r="15.9155" fill="none" stroke="${s.c||PAL[i%PAL.length]}" stroke-width="6" data-da="${p.toFixed(2)}" stroke-dasharray="0 100" stroke-dashoffset="${(25-off).toFixed(2)}"/>`;off+=p});
  const top=segs.slice(0,o.max||6);
  return `<div class="donut-wrap"><svg class="donut" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--surface2)" stroke-width="6"/>${c}
    <text x="21" y="20" text-anchor="middle" font-size="3.4" fill="var(--muted)">${esc(o.center||'المجموع')}</text><text x="21" y="25" text-anchor="middle" font-size="4.2" font-weight="700" fill="var(--text)">${esc(o.centerVal||compact(tot))}</text></svg>

function countUp(el){
  const to=+el.dataset.count,pre=el.dataset.pre||'',suf=el.dataset.suf||'',dec=+el.dataset.dec||0,dur=1250,t0=performance.now();
  cancelAnimationFrame(el._raf);
  const step=t=>{const p=Math.min((t-t0)/dur,1),e=p===1?1:1-Math.pow(2,-10*p);
    el.textContent=pre+fmtN(to*e,p===1?dec:0)+suf;if(p<1)el._raf=requestAnimationFrame(step)};
  el._raf=requestAnimationFrame(step)}
const raf2=f=>requestAnimationFrame(()=>requestAnimationFrame(f));
function fillBars(scope,reset){
  $$('[data-w]',scope).forEach(b=>{if(reset){b.style.transition='none';b.style.width='0';void b.offsetWidth;b.style.transition=''}raf2(()=>b.style.width=b.dataset.w+'%')});

  $$('.donut .s',scope).forEach(c=>{if(reset){c.style.transition='none';c.setAttribute('stroke-dasharray','0 100');c.getBoundingClientRect();c.style.transition=''}raf2(()=>c.setAttribute('stroke-dasharray',`${c.dataset.da} ${100-c.dataset.da}`))});
}
function animate(scope,reset){$$('[data-count]',scope).forEach(countUp);fillBars(scope,reset)}
function finalize(scope){
  $$('[data-count]',scope).forEach(el=>el.textContent=(el.dataset.pre||'')+fmtN(+el.dataset.count,+el.dataset.dec||0)+(el.dataset.suf||''));
  $$('[data-w]',scope).forEach(b=>{b.style.transition='none';b.style.width=b.dataset.w+'%'});

function jChecks(j){
  const total=sum(j.members,m=>m.shares);
  const turnsOk=j.turns.length===j.months&&j.turns.every(t=>Math.abs(sum(t,x=>x.f)-1)<1e-6);
  const asg={};j.turns.flat().forEach(x=>asg[x.m]=(asg[x.m]||0)+x.f);
  const matchOk=j.members.every(m=>Math.abs((asg[m.id]||0)-m.shares)<1e-6)&&Object.keys(asg).every(k=>j.members.some(m=>m.id===k));
  return [[Math.abs(total-j.months)<1e-6,`مجموع الأسهم ${fmtN(total,2)} = عدد الأشهر ${dg(j.months)}`],[turnsOk,'كل دورة تساوي سهماً كاملاً بالضبط'],[matchOk,'استلام كل عضو يطابق عدد أسهمه']]}
function jAuto(j){const q=j.members.map(m=>({id:m.id,r:m.shares}));const turns=[];
  for(let i=0;i<j.months;i++){let need=1;const t=[];while(need>1e-6&&q.length){const e=q[0],take=Math.min(need,e.r);t.push({m:e.id,f:Math.round(take*1e4)/1e4});e.r-=take;need-=take;if(e.r<1e-6)q.shift()}turns.push(t)}
  j.turns=turns}

const debtPaid=d=>sumTx(t=>refIs(t,'debt',{id:d.id,pay:true}));
const debtRemain=d=>Math.max(0,d.amount-debtPaid(d));
const instPaidCount=d=>d.inst?Math.min(d.inst.count,Math.floor(debtPaid(d)/d.inst.each+1e-6)):0;
const instNext=d=>{if(!d.inst)return null;const n=instPaidCount(d);if(n>=d.inst.count)return null;const s=parseD(d.inst.start);const [y,m]=addM(s.getFullYear(),s.getMonth()+1,n);return `${mkey(y,m)}-${pad(Math.min(s.getDate(),28))}`};
function debtDue(d){return d.inst?instNext(d):d.due}
function debtState(d){if(debtRemain(d)<=0)return ['مسدد','em'];const du=debtDue(d);if(du&&du<TODAY())return ['متأخر','red'];if(du)return ['يستحق '+dLabel(du),''];return ['مفتوح','gray']}
function removeDebt(id){S.debts=S.debts.filter(d=>d.id!==id);S.tx=S.tx.filter(t=>!refIs(t,'debt',{id}))}

  if(DSEG==='people'){const ppl={};S.debts.forEach(d=>{const p=ppl[d.person]=ppl[d.person]||{l:0,b:0,n:0};p.n++;if(d.dir==='lent')p.l+=debtRemain(d);else p.b+=debtRemain(d)});
    const ks=Object.keys(ppl).sort((a,b)=>Math.abs(ppl[b].l-ppl[b].b)-Math.abs(ppl[a].l-ppl[a].b));
    ks.sort((a,b)=>((trustOf(b)||{score:-1}).score)-((trustOf(a)||{score:-1}).score));
    h+=ks.length?`<p class="muted" style="font-size:12px;margin-bottom:8px">نسبة الأمان تُحسب من سجل سداد كل شخص لما أقرضته — اضغط الشخص للتفاصيل</p><div class="card flat" style="padding:4px 14px">${ks.map(k=>{const p=ppl[k],net=p.l-p.b,tr=trustOf(k);return `<div class="li" data-act="${tr?'trust':'report'}" data-s="debts" data-person="${esc(k)}"><i class="av sm">${esc(k[0])}</i><div class="info"><b>${esc(k)} ${tr?`<span class="badge ${tr.cls}">🛡 ${nm(dg(tr.score))}٪ · ${tr.label}</span>`:''}</b><small>${dg(p.n)} دين${tr?` · سدد بالوقت ${dg(tr.onTime)} من ${dg(tr.n)}`:' · اضغط لكشف الحساب'}</small></div><span class="v ${net>0?'in':net<0?'out':'muted'}"><small style="display:block;font-size:10px;font-weight:600">${net>0?'لي عنده':net<0?'له عليّ':'مسدد'}</small><span class="num">${money(Math.abs(net))}</span></span></div>`}).join('')}</div>`:empty('لا توجد ديون بعد','debtNew','دين جديد');

  }
  h+='</div>';
  if(S.debts.length){const byP={};S.debts.filter(d=>debtRemain(d)>0).forEach(d=>byP[d.person]=(byP[d.person]||0)+debtRemain(d));
    h+=sec('الإحصائيات','',`<div class="card"><div class="row" style="margin-bottom:10px"><b>المتبقي حسب الشخص</b></div>${donut(Object.keys(byP).map(k=>({l:k,v:byP[k]})),{center:'المتبقي'})}</div>
      <div class="kpis" style="margin-top:10px">${kpi('مجموع ما أقرضته',cnt(sum(lent,d=>d.amount)))}${kpi('حصّلت منه',`<span class="in">${cnt(sum(lent,debtPaid))}</span>`)}${kpi('مجموع ما استدنته',cnt(sum(bor,d=>d.amount)))}${kpi('سددت منه',`<span class="out">${cnt(sum(bor,debtPaid))}</span>`)}</div>`)}
  return h};

const rentTx=(u,mk)=>S.tx.find(t=>refIs(t,'rent',{uid:u.id,month:mk}));
function unitStatus(u,y,m){if(u.vacant)return 'vacant';if(!(+u.rent>0))return 'setup';const mk=mkey(y,m);if(rentTx(u,mk))return 'paid';
  const nk=NOWK();if(mk<nk)return 'late';if(mk>nk)return 'pending';return (+TODAY().slice(8))>(+u.dueDay||1)?'late':'pending'}
const propExpected=p=>sum(p.units.filter(u=>!u.vacant),u=>toIQD(u.rent,u.currency));
const propCollected=(p,mk)=>sumTx(t=>refIs(t,'rent',{pid:p.id,month:mk}));
V.prop=()=>{
  const [y,m]=VM,mk=mkey(y,m),all=S.props.flatMap(p=>p.units);
  const exp=sum(S.props,propExpected),col=sum(S.props,p=>propCollected(p,mk)),cnts={paid:0,late:0,pending:0,vacant:0,setup:0};

    <div class="stats"><div class="stat"><small>مُستلم</small><b>${cnt(cnts.paid)}</b></div><div class="stat"><small>متأخر</small><b>${cnt(cnts.late)}</b></div><div class="stat"><small>شاغر</small><b>${cnt(cnts.vacant)}</b></div></div></div>`;
  if(!S.props.length)return h+'<div class="sec">'+empty('أضف عقارك: اكتب عدد المحلات والشقق وسيُبنى لك تلقائياً لتتابع الإيجارات وحدة وحدة','propNew','إضافة عقار')+'</div>';
  const soon=all.filter(u=>u.contractEnd&&!u.vacant&&u.contractEnd<=ymd(new Date(Date.now()+45*864e5)));
  if(soon.length)h+=`<div class="sec"><div class="card flat" style="border-color:color-mix(in srgb,var(--warn) 50%,transparent)"><b style="font-size:13px">⏰ عقود تنتهي قريباً</b>${soon.map(u=>{const p=S.props.find(pp=>pp.units.includes(u));return `<div class="row" style="margin-top:6px"><span>${esc(u.label)} · ${esc(p.name)}${u.tenant?' · '+esc(u.tenant):''}</span><span class="badge ${u.contractEnd<TODAY()?'red':''}">${dLabelY(u.contractEnd)}</span></div>`}).join('')}</div></div>`;

   ZAKAT (assets-based, nisab, lunar hawl)
   ===================================================================== */
const ZM_L={full:'القيمة السوقية كاملة',pct:'نسبة من القيمة',none:'لا زكاة على الأصل (تُزكّى عوائده)'};
const defaultZM=v=>['stocks','gold'].includes(v.type)?'full':'none';
function hParts(d){try{const p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(d);
  const g=k=>parseInt((p.find(x=>x.type===k)||{}).value);return {d:g('day'),m:g('month'),y:g('year')}}catch(e){return null}}
const hijri=s=>{if(!s)return '';try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-'+(S.settings.digits==='ar'?'arab':'latn'),{day:'numeric',month:'long',year:'numeric'}).format(parseD(s))}catch(e){return ''}};
function hawlDue(start){const s=parseD(start),hs=hParts(s);
  for(let k=350;k<=360;k++){const d=new Date(s.getFullYear(),s.getMonth(),s.getDate()+k),h=hParts(d);if(hs&&h&&h.y===hs.y+1&&(h.m>hs.m||(h.m===hs.m&&h.d>=hs.d)))return ymd(d)}
  return ymd(new Date(s.getFullYear(),s.getMonth(),s.getDate()+354))}
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
function jamZakat(){let rec=0,owe=0;
  S.jams.forEach(j=>{let paid,got;if(j.mode==='part'){paid=sumTx(t=>refIs(t,'jamp',{id:j.id}));got=sumTx(t=>refIs(t,'jampr',{id:j.id}))}
    else{paid=sumTx(t=>refIs(t,'jamme',{id:j.id}));got=sumTx(t=>refIs(t,'jamrecv',{id:j.id}))}
    if(paid>got)rec+=paid-got;else owe+=got-paid});
  return {rec,owe}}
function zakatCalc(){
  const z=S.zakat,gp=+z.goldPrice||0,sp=+z.silverPrice||0,A=[],D=[];
  A.push({k:'cash',l:'النقد في المحافظ والبطاقات',v:Math.max(0,totalBalance()),on:true,hint:`${dg(S.wallets.length)} محفظة · الدولار محوّل بسعر ${fmtN(S.settings.rate)}`});
  A.push({k:'otherCash',l:'نقد خارج التطبيق',v:+z.otherCash||0,on:true,act:'zakVal',f:'otherCash',hint:'مال في البيت أو حساب غير مسجل هنا'});
  A.push({k:'goals',l:'مدخرات الأهداف',v:sum(S.goals,g=>Math.max(0,goalSaved(g))),on:z.goals,tog:'goals',hint:'مال مملوك لك وإن خصصته لهدف'});
  const J=jamZakat();
  A.push({k:'jam',l:'ما دفعته في الجمعيات ولم تستلمه',v:J.rec,on:z.jam,tog:'jam',hint:'دين لك على الجمعية'});
  A.push({k:'rec',l:'ديون لك مرجوّة السداد',v:sum(S.debts.filter(d=>d.dir==='lent'&&!d.doubtful),debtRemain),on:z.receivables,tog:'receivables',hint:'المشكوك فيها لا تُزكّى حتى تُقبض'});
  const gi=(z.gold||[]).map(g=>({...g,v:(+g.grams||0)*((+g.karat||24)/24)*gp}));
  A.push({k:'gold',l:'الذهب',v:sum(gi.filter(g=>!g.jewelry||z.jewelry),g=>g.v),on:true,act:'zakGold',hint:gi.length?`${fmtN(sum(gi,g=>+g.grams),2)} غرام${gi.some(g=>g.jewelry)&&!z.jewelry?' · الحلي المستعمل مستثنى':''}`:'اضغط لإضافة ذهبك'});
  A.push({k:'silver',l:'الفضة',v:(+z.silverGrams||0)*sp,on:true,act:'zakVal',f:'silverGrams',hint:`${fmtN(+z.silverGrams||0,2)} غرام`});
  A.push({k:'trade',l:'عروض التجارة (بضاعة للبيع)',v:+z.trade||0,on:true,act:'zakVal',f:'trade',hint:'تُقوَّم بسعر البيع يوم وجوب الزكاة'});
  const iv=S.invs.map(v=>{const m=v.zakatMode||defaultZM(v),val=toIQD(v.current,v.currency);return {v,m,z:m==='full'?val:m==='pct'?val*(+v.zakatPct||0)/100:0}});
  A.push({k:'inv',l:'الاستثمارات',v:sum(iv,x=>x.z),on:true,act:'zakInvs',hint:iv.length?iv.map(x=>x.v.name+': '+(x.m==='full'?'كاملة':x.m==='pct'?fmtN(x.v.zakatPct||0)+'%':'معفاة')).join(' · '):'لا توجد'});
  D.push({k:'debts',l:'ديون عليك حالّة (خلال سنة)',v:sum(S.debts.filter(d=>d.dir==='borrowed'),d=>d.inst?Math.min(debtRemain(d),12*d.inst.each):debtRemain(d)),on:z.deduct,tog:'deduct'});
  D.push({k:'jamowe',l:'أقساط متبقية عليك للجمعيات بعد استلامك',v:J.owe,on:z.deduct,tog:'deduct'});
  const total=sum(A.filter(a=>a.on),a=>a.v),ded=sum(D.filter(d=>d.on),d=>d.v),net=Math.max(0,total-ded);
  const nisab=z.base==='silver'?595*sp:85*gp,priced=z.base==='silver'?sp>0:gp>0,reached=priced&&net>=nisab,zakat=reached?net*0.025:0;
  const paid=sumTx(t=>refIs(t,'zakat',{hawl:z.hawlStart||''}));
  return {A,D,total,ded,net,nisab,priced,reached,zakat,paid,remain:Math.max(0,zakat-paid),iv,gi,due:z.hawlStart?hawlDue(z.hawlStart):''}}

   JAMAEYA LOTTERY (قرعة)
   ===================================================================== */
const rndInt=n=>{try{return crypto.getRandomValues(new Uint32Array(1))[0]%n}catch(e){return Math.floor(Math.random()*n)}};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const k=rndInt(i+1);[a[i],a[k]]=[a[k],a[i]]}return a};
function drawTickets(j){const whole=[],parts=[];
  j.members.forEach(m=>{const w=Math.floor(m.shares+1e-9);for(let i=0;i<w;i++)whole.push([{m:m.id,f:1}]);const r=Math.round((m.shares-w)*1e4)/1e4;if(r>1e-6)parts.push({m:m.id,f:r})});
  shuffle(parts);const tk=[...whole];let cur=[],need=1;
  parts.forEach(p=>{let left=p.f;while(left>1e-6){const take=Math.min(need,left);cur.push({m:p.m,f:Math.round(take*1e4)/1e4});left-=take;need-=take;if(need<1e-6){tk.push(cur);cur=[];need=1}}});
  if(cur.length)tk.push(cur);return shuffle(tk)}
let DRAW=null;
ACT.jdraw=()=>{const j=jamById(PARAM),total=sum(j.members,m=>m.shares);
  if(Math.abs(total-j.months)>1e-6){toast(`مجموع الأسهم ${fmtN(total,2)} لا يساوي عدد الأشهر ${dg(j.months)} — أكمل الأعضاء أولاً`);return}
  if(Object.keys(j.delivered).some(k=>j.delivered[k])){toast('القرعة تُجرى قبل تسليم أي دورة — استخدم «تبديل الترتيب»');return}
  runDraw(j)};
function runDraw(j){const tk=drawTickets(j);DRAW={j:j.id,tk};
  openSheet(`${sheetHead('🎲 قرعة '+esc(j.name))}<p class="muted" style="font-size:12px;margin-top:4px">ترتيب عشوائي آمن لاستلام ${dg(j.months)} دورة · ${dg(j.members.length)} عضو</p>
    <div id="drawList" class="card flat" style="padding:4px 14px;margin-top:12px">${tk.map((t,k)=>`<div class="turn"><div class="no num">${dg(k+1)}</div><div class="info"><b>${jLabel(j,k)}</b><div class="recv"><span style="opacity:.5">؟</span></div></div></div>`).join('')}</div>
    <div class="btns" id="drawBtns" style="opacity:.35;pointer-events:none"><button class="btn ghost" data-act="jdrawAgain">🔄 إعادة القرعة</button><button class="btn gold" data-act="jdrawOk">✓ اعتماد</button></div>`);
  const names=j.members.map(m=>m.name),rows=$$('#drawList .turn');let k=0;
  const next=()=>{if(DRAW&&DRAW.tk!==tk)return;if(k>=rows.length){const b=$('#drawBtns');if(b){b.style.opacity=1;b.style.pointerEvents=''}return}
    const row=rows[k],box=$('.recv',row),t=tk[k];let n=0;row.scrollIntoView&&row.scrollIntoView({block:'nearest',behavior:'smooth'});
    const iv=setInterval(()=>{if(DRAW&&DRAW.tk!==tk){clearInterval(iv);return}box.innerHTML=`<span style="opacity:.65">${esc(names[rndInt(names.length)])}</span>`;
      if(++n>7){clearInterval(iv);box.innerHTML=t.map(x=>`<span class="pop">${esc(jMem(j,x.m).name)}${x.f<1?' · '+shareLbl(x.f):''} · <b class="num">${compact(x.f*jPayout(j))}</b></span>`).join('');row.classList.add('done');k++;setTimeout(next,110)}},50)};
  next()}
ACT.jdrawAgain=()=>runDraw(jamById(DRAW.j));
ACT.jdrawOk=()=>{const j=jamById(DRAW.j);j.turns=DRAW.tk;j.drawAt=new Date().toISOString();DRAW=null;save();closeSheet();render(false);toast('اعتُمدت القرعة ✓')};

/* =====================================================================
   TRUST SCORE for borrowers (نسبة الأمان)
   ===================================================================== */
function trustOf(name){
  const ds=S.debts.filter(d=>d.dir==='lent'&&d.person===name);if(!ds.length)return null;
  let ws=0,ss=0,done=0,onTime=0,late=0,overdue=0,open=0,daysSum=0,maxOk=0;const today=TODAY();
  ds.forEach(d=>{const pays=S.tx.filter(t=>refIs(t,'debt',{id:d.id,pay:true})).sort((a,b)=>a.date<b.date?-1:1);let cum=0,fin=null;
    for(const p of pays){cum+=txIQD(p);if(cum>=d.amount-0.5){fin=p.date;break}}
    let sc,w=1;
    if(fin){done++;const days=Math.max(0,daysBetween(d.date,fin));daysSum+=days;
      if(d.due){const lt=daysBetween(d.due,fin);if(lt<=0){sc=100;onTime++;maxOk=Math.max(maxOk,d.amount)}else{sc=Math.max(30,100-lt*1.5);late++}}
      else{sc=days<=30?100:days<=60?88:days<=90?75:days<=180?60:45;if(days<=60){onTime++;maxOk=Math.max(maxOk,d.amount)}else late++}}
    else{open++;const pr=d.amount?cum/d.amount:0;
      if(d.due&&d.due<today){overdue++;sc=Math.max(0,40-daysBetween(d.due,today)*0.5+pr*20)}
      else{const age=daysBetween(d.date,today);sc=70+30*pr-(!d.due&&age>90?Math.min(30,(age-90)/6):0);w=0.6}}
    const wt=w*Math.log10(10+d.amount/10000);ws+=wt;ss+=sc*wt});
  const score=Math.round(ss/ws);
  const [label,cls,adv]=score>=85?['موثوق جداً','em','يمكن إقراضه باطمئنان']:score>=70?['جيد','em','يسدد غالباً — أقرضه ضمن حدود ما سدده سابقاً']:score>=50?['متوسط','','أقرضه بحذر وبمبالغ صغيرة مع موعد واضح']:score>=30?['ضعيف','red','لا يُنصح بإقراضه إلا بضمان']:['خطر','red','لا يُنصح بإقراضه'];
  return {score,label,cls,adv,n:ds.length,done,onTime,late,overdue,open,avgDays:done?Math.round(daysSum/done):null,maxOk,outstanding:sum(ds,debtRemain)}}
ACT.trust=d=>{const name=d.person,t=trustOf(name);if(!t){toast('لا يوجد سجل إقراض لهذا الشخص');return}
  const color=t.cls==='em'?'var(--em)':t.cls==='red'?'var(--expense)':'var(--gold)';
  openSheet(`${sheetHead('نسبة الأمان · '+esc(name))}<div class="goal" style="margin-top:14px;cursor:default">${ringSvg(t.score,color).replace('data-suf="%"','data-suf=""')}<div style="flex:1"><h3>${t.label} <span class="badge ${t.cls}">${nm(dg(t.score))} / ${nm(dg(100))}</span></h3><p>${t.adv}</p></div></div>

function padTurns(j){j.turns=j.turns||[];while(j.turns.length<j.months)j.turns.push([]);if(j.turns.length>j.months){const extra=j.turns.splice(j.months);if(extra.flat().length)toast('قلّ عدد الأشهر — راجع ترتيب الأعضاء الذين أُزيلت دوراتهم')}}
const piecesOf=sh=>{const p=[];let r=Math.round(sh*1e4)/1e4;while(r>=1-1e-9){p.push(1);r=Math.round((r-1)*1e4)/1e4}if(r>1e-6)p.push(r);return p};
const turnFree=(j,k,mid)=>1-sum((j.turns[k]||[]).filter(x=>x.m!==mid),x=>x.f);
function placeMember(j,mem){padTurns(j);
  const fixed=j.turns.map((t,k)=>j.delivered[k]?t.filter(x=>x.m===mem.id).map(x=>({k,f:x.f})):[]).flat();
  const fixedSum=sum(fixed,x=>x.f),pieces=piecesOf(Math.max(0,mem.shares-fixedSum));
  if(!pieces.length){toast('أسهم '+mem.name+' كلها مستلمة');return}
  const cur=j.turns.map((t,k)=>j.delivered[k]?[]:t.filter(x=>x.m===mem.id).map(x=>({k,f:x.f}))).flat();
  const opts=f=>j.turns.map((t,k)=>[k,turnFree(j,k,mem.id)]).filter(([k,c])=>!j.delivered[k]&&c>=f-1e-6).map(([k,c])=>[k,`الدورة ${dg(k+1)} · ${jLabel(j,k)} — متاح ${shareLbl(Math.round(c*1e4)/1e4)}`]);
  const used={},take=(k,f)=>{used[k]=(used[k]||0)+f;return k};
  const curLeft=cur.map(x=>({...x}));
  const defs=pieces.map(f=>{const c=curLeft.find(x=>x.f>=f-1e-6);if(c){c.f-=f;if(c.f<1e-6)curLeft.splice(curLeft.indexOf(c),1);return take(c.k,f)}
    const o=j.turns.map((t,k)=>k).find(k=>!j.delivered[k]&&turnFree(j,k,mem.id)-(used[k]||0)>=f-1e-6);return o!=null?take(o,f):''});
  const fields=pieces.map((f,i)=>({k:'p'+i,label:`${pieces.length>1?(['السهم الأول','السهم الثاني','السهم الثالث','السهم الرابع','السهم الخامس'][i]||'السهم '+(i+1)):'السهم'} (${shareLbl(f)} · يستلم ${money(f*jPayout(j))})`,type:'select',options:[['','— بدون ترتيب الآن —'],...opts(f)]}));
  const values={};defs.forEach((k,i)=>values['p'+i]=k);
  form({title:'ترتيب استلام '+mem.name,top:`<p class="muted" style="font-size:12px;margin-top:6px;line-height:1.8">${mem.name} داخل بـ${shareLbl(mem.shares)} (${money(jDue(j,mem))} شهرياً). اختر الشهر الذي يستلم فيه كل جزء — لا حاجة لكتابة اسمه مرتين.</p>`,fields,values,submit:'حفظ الترتيب',
    onSave:v=>{const pick=pieces.map((f,i)=>({f,k:v['p'+i]===''?null:+v['p'+i]}));
      const need={};pick.filter(p=>p.k!=null).forEach(p=>need[p.k]=(need[p.k]||0)+p.f);
      for(const k in need)if(need[k]>turnFree(j,+k,mem.id)+1e-6){toast(`الدورة ${dg(+k+1)} لا تتسع لهذا المقدار`);return false}
      j.turns=j.turns.map((t,k)=>j.delivered[k]?t:t.filter(x=>x.m!==mem.id));
      pick.filter(p=>p.k!=null).forEach(p=>{const ex=j.turns[p.k].find(x=>x.m===mem.id);if(ex)ex.f=Math.round((ex.f+p.f)*1e4)/1e4;else j.turns[p.k].push({m:mem.id,f:p.f})});
      save();render(false);toast(pick.some(p=>p.k==null)?'حُفظ — بقي جزء بلا ترتيب':'رُتّب استلام '+mem.name+' ✓')}})}
ACT.memPlace=d=>{const j=jamById(PARAM);placeMember(j,jMem(j,d.id))};

/* ---------- jam: installment dates & payout settlement ---------- */
const jMonthDate=(j,i)=>{const k=mkey(...jMonth(j,i));return k===NOWK()?TODAY():`${k}-01`};
function receiveFlow(j,amount,paid,recvRef,flag,doneMsg){
  if(!S.wallets.length){toast('أضف محفظة أولاً');return}
  const adv=Math.max(0,amount-paid);
  form({title:'استلام مبلغ '+j.name,top:`<div class="kv"><div><small>المبلغ المستلم</small><b class="num">${money(amount)}</b></div><div><small>ما دفعته حتى الآن</small><b class="num">${money(paid)}</b></div></div>`,
    fields:[{k:'mode',label:'هل أستقطع ما دفعته من الادخار؟',type:'chips',options:[['settle','نعم (موصى به)'],['full','لا']],
      hint:`نعم: يُطرح ${money(Math.min(paid,amount))} من ادخارك، ${adv?`والباقي ${money(adv)} سلفة من الجمعية تسددها بأقساطك القادمة، وهذه الأقساط لا تُحسب ادخاراً`:'ولا يتغير شيء آخر'}. لا: يُطرح المبلغ كله من الادخار.`},
      {k:'w',label:'استلمته في',type:'select',options:walletOpts()},{k:'date',label:'التاريخ',type:'date'}],
    values:{mode:'settle',w:j.walletId||lastWallet()},submit:'تسجيل الاستلام',
    onSave:v=>{const w=wById(v.w),cv=n=>fromIQD(n,w.currency);
      if(v.mode==='settle'){const back=Math.min(paid,amount);
        if(back>0)addTx({type:'unsave',amount:cv(back),walletId:w.id,date:v.date,note:`استلامي من ${j.name} · استقطاع ما دفعته`,ref:recvRef});
        if(adv>0)addTx({type:'borrow',amount:cv(adv),walletId:w.id,date:v.date,note:`استلامي من ${j.name} · سلفة تُسدد بالأقساط`,ref:{...recvRef,kind:'jamadv'}});
        j[flag]=true}
      else addTx({type:'unsave',amount:cv(amount),walletId:w.id,date:v.date,note:`استلامي من ${j.name}`,ref:recvRef});
      save();render(false);toast(doneMsg)}})}
function undoReceive(j,recvKind,flag,match){
  S.tx=S.tx.filter(t=>!((t.ref&&t.ref.id===j.id)&&(t.ref.kind===recvKind||t.ref.kind==='jamadv')&&match(t)));
  if(j[flag]){const ins=recvKind==='jampr'?'jamp':'jamme';S.tx.forEach(t=>{if(t.type==='repay'&&refIs(t,ins,{id:j.id})){t.type='save';t.note=t.note.replace(' · سداد بعد الاستلام','')}})}
  j[flag]=false}
ACT.jpPay=d=>{const j=jamById(PARAM),i=+d.i,ex=jpPaid(j,i);
  if(ex){if(confirm('إلغاء دفع '+jLabel(j,i)+'؟')){removeTx(ex.id);save();render(false)}return}
  const after=!!j.settled;
  pickWallet(`قسط ${jLabel(j,i)}`,j.share,(wid,date)=>{addTx({type:after?'repay':'save',amount:fromIQD(j.share,wById(wid).currency),walletId:wid,date,note:`قسط ${j.name} · ${jLabel(j,i)}${after?' · سداد بعد الاستلام':''}`,ref:{kind:'jamp',id:j.id,idx:i}});
    save();render(false);toast(after?'سُجّل القسط (سداد لما استلمته — ليس ادخاراً) ✓':'سُجّل القسط كادخار ✓')},j.walletId,jMonthDate(j,i))};
ACT.jpRecv=()=>{const j=jamById(PARAM),ex=jpRecv(j)||S.tx.find(t=>refIs(t,'jamadv',{id:j.id}));
  if(ex){if(confirm('إلغاء تسجيل الاستلام؟ ستعود أقساطك اللاحقة ادخاراً.')){undoReceive(j,'jampr','settled',()=>true);save();render(false)}return}
  const paid=sumTx(t=>refIs(t,'jamp',{id:j.id}));
  receiveFlow(j,j.recvAmount,paid,{kind:'jampr',id:j.id},'settled','سُجّل الاستلام ✓')};
ACT.jst=(orig=>d=>{const j=jamById(PARAM),i=clamp(JIDX[j.id],0,j.months-1),mem=jMem(j,d.mid),st=jStatus(j,i,d.mid);
  if(mem.isMe&&st==='unpaid'){const after=!!j.meSettled;
    return pickWallet('من أي محفظة دفعت قسطك؟',jDue(j,mem),(wid,date)=>{j.pay[i]=j.pay[i]||{};j.pay[i][mem.id]='paid';
      addTx({type:after?'repay':'save',amount:fromIQD(jDue(j,mem),wById(wid).currency),walletId:wid,date,note:`قسطي في ${j.name} · ${jLabel(j,i)}${after?' · سداد بعد الاستلام':''}`,ref:{kind:'jamme',id:j.id,idx:i,mid:mem.id}});
      save();render(false);toast(after?'سُجّل قسطك (سداد لما استلمته) ✓':'سُجّل قسطك كادخار ✓')},null,jMonthDate(j,i))}
  return orig(d)})(ACT.jst);
ACT.jdel=(orig=>d=>{const j=jamById(PARAM),i=+d.i,t=j.turns[i]||[],me=t.find(x=>jMem(j,x.m).isMe);
  if(j.delivered[i]){if(!confirm('إلغاء تسجيل التسليم؟'))return;delete j.delivered[i];if(me)undoReceive(j,'jamrecv','meSettled',x=>x.ref.idx===i);save();render(false);return}
  if(!me)return orig(d);
  const meM=jMem(j,me.m),paid=sumTx(x=>refIs(x,'jamme',{id:j.id})&&x.type==='save');
  receiveFlow(j,me.f*jPayout(j),paid,{kind:'jamrecv',id:j.id,idx:i},'meSettled','سُجّل استلامك ✓');
  const _f=FORM.onSave;FORM.onSave=v=>{j.delivered[i]=true;return _f(v)}})(ACT.jdel);
jamZakat=function(){let rec=0,owe=0;
  S.jams.forEach(j=>{const ins=j.mode==='part'?'jamp':'jamme',rv=j.mode==='part'?'jampr':'jamrecv';
    const saved=sumTx(t=>t.type==='save'&&refIs(t,ins,{id:j.id}))-sumTx(t=>t.type==='unsave'&&refIs(t,rv,{id:j.id}));
    const adv=sumTx(t=>refIs(t,'jamadv',{id:j.id}))-sumTx(t=>t.type==='repay'&&refIs(t,ins,{id:j.id}));
    if(saved>0)rec+=saved;else owe+=-saved;if(adv>0)owe+=adv});
  return {rec,owe}};

/* ---------- encrypted sync between my devices (GitHub Gist) ---------- */
const SK='khizana_sync',SFILE='khizana-sync.json';
let SY={};try{SY=JSON.parse(localStorage.getItem(SK)||'{}')||{}}catch(e){SY={}}
const saveSY=()=>{try{localStorage.setItem(SK,JSON.stringify(SY))}catch(e){}};
if(!SY.device){const ua=navigator.userAgent;SY.device=(/iPhone/.test(ua)?'آيفون':/iPad/.test(ua)?'آيباد':/Android/.test(ua)?'أندرويد':/Mac/.test(ua)?'ماك':/Windows/.test(ua)?'ويندوز':'جهاز')+'-'+Math.random().toString(36).slice(2,6);saveSY()}
const _te={encode:x=>new TextEncoder().encode(x)},_td={decode:x=>new TextDecoder().decode(x)};
const toB64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const fromB64=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function skey(pass,salt){const base=await crypto.subtle.importKey('raw',_te.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(at){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await skey(SY.pass,salt),_te.encode(JSON.stringify(S))));
  return JSON.stringify({app:'khizana',v:1,updatedAt:at,device:SY.device,salt:toB64(salt),iv:toB64(iv),data:toB64(ct)})}
async function unseal(txt){const o=JSON.parse(txt);let pt;
  try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(o.iv)},await skey(SY.pass,fromB64(o.salt)),fromB64(o.data))}catch(e){const er=new Error('كلمة سر المزامنة غير صحيحة');er.code='pass';throw er}
  return {meta:o,data:JSON.parse(_td.decode(pt))}}
async function gh(path,opt={}){const r=await fetch('https://api.github.com'+path,{...opt,headers:{Authorization:'Bearer '+SY.token,Accept:'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(!r.ok){const e=new Error(r.status===401?'التوكن غير صالح أو منتهي':r.status===404?'لم يُعثر على ملف المزامنة':'خطأ من GitHub ('+r.status+')');e.status=r.status;throw e}return r.json()}
async function ghFind(){for(let p=1;p<=5;p++){const l=await gh(`/gists?per_page=100&page=${p}`);const g=l.find(x=>x.files&&x.files[SFILE]);if(g)return g.id;if(l.length<100)break}return null}
async function ghRead(){const g=await gh('/gists/'+SY.gist),f=g.files&&g.files[SFILE];if(!f)return null;return f.truncated?await (await fetch(f.raw_url)).text():f.content}
const ghWrite=txt=>gh('/gists/'+SY.gist,{method:'PATCH',body:JSON.stringify({files:{[SFILE]:{content:txt}}})});
const ghCreate=txt=>gh('/gists',{method:'POST',body:JSON.stringify({description:'خِزانة — مزامنة مشفّرة (لا تحذف)',public:false,files:{[SFILE]:{content:txt}}})});
let APPLYING=false,SYBUSY=false,SYT=null,BOOTED=false;
save=(o=>function(){o();if(!APPLYING&&BOOTED&&SY.on){SY.localAt=Date.now();SY.dirty=true;saveSY();clearTimeout(SYT);SYT=setTimeout(()=>syncNow(),2500)}})(save);
function applyRemote(r){APPLYING=true;S=r.data;normalize();save();APPLYING=false;SY.syncedAt=r.meta.updatedAt;SY.localAt=r.meta.updatedAt;SY.dirty=false;SY.last=Date.now();SY.err='';saveSY();
  try{applyTheme();greet()}catch(e){}render(false);toast('وصلت آخر التعديلات من '+(r.meta.device||'جهازك الآخر')+' ✓')}
function syncBadge(){const el=$('#syncDot');if(el){el.className='sync-dot '+(!SY.on?'':SY.err?'err':SY.dirty?'wait':'ok');el.title=!SY.on?'':SY.err||(SY.dirty?'بانتظار المزامنة':'متزامن')}
  if(VIEW==='set'){const st=$('#syncState');if(st)st.innerHTML=syncStateHTML()}}
async function syncNow(manual){if(!SY.on||SYBUSY)return;if(!navigator.onLine){SY.err='بدون إنترنت — ستتم المزامنة عند عودة الاتصال';syncBadge();return}
  SYBUSY=true;try{
    const txt=await ghRead();let remote=null;if(txt){const m=JSON.parse(txt);if(m.updatedAt>(SY.syncedAt||0)&&m.device!==SY.device)remote=await unseal(txt)}
    if(remote){if(!SY.dirty){applyRemote(remote);SYBUSY=false;return}SYBUSY=false;return syncConflict(remote)}
    if(SY.dirty||manual){const at=SY.localAt||Date.now();await ghWrite(await seal(at));SY.syncedAt=at;SY.dirty=false}
    SY.last=Date.now();SY.err='';saveSY();if(manual)toast('تمت المزامنة ✓')}
  catch(e){SY.err=e.message||'تعذّرت المزامنة';saveSY();if(manual)toast(SY.err)}
  SYBUSY=false;syncBadge()}
function syncConflict(remote){openSheet(`${sheetHead('تعديلات على جهازين')}<p class="muted" style="font-size:13px;line-height:1.9;margin-top:8px">عدّلت البيانات على هذا الجهاز وعلى «${esc(remote.meta.device||'جهاز آخر')}» قبل أن تتزامن. أي نسخة تعتمد؟ (النسخة الأخرى تُستبدل)</p>
  <div class="kv"><div><small>هذا الجهاز</small><b>${dg(S.tx.length)} حركة</b></div><div><small>الجهاز الآخر</small><b>${dg((remote.data.tx||[]).length)} حركة · ${new Date(remote.meta.updatedAt).toLocaleString('ar-IQ')}</b></div></div>
  <div class="btns"><button class="btn gold" data-act="syKeepMine">نسخة هذا الجهاز</button><button class="btn ghost" data-act="syTakeRemote">نسخة الجهاز الآخر</button></div>`);
  ACT.syTakeRemote=()=>{closeSheet();applyRemote(remote)};ACT.syKeepMine=async()=>{closeSheet();SY.syncedAt=remote.meta.updatedAt;SY.dirty=true;SY.localAt=Date.now();saveSY();await syncNow(true)}}

ACT.syncSetup=()=>form({title:'ربط المزامنة بين أجهزتي',top:`<div class="card flat" style="margin-top:10px;font-size:12px;line-height:1.9">
  <b>كيف تعمل؟</b> تُشفَّر بياناتك على جهازك بكلمة سر تختارها، ثم تُحفظ في ملف خاص بحسابك على GitHub، وكل جهاز تربطه بنفس التوكن ونفس كلمة السر يتزامن تلقائياً عند كل تعديل.<br>

    const inn=sum(xs,x=>Math.max(0,walletDelta(x,w.id))),out=sum(xs,x=>Math.max(0,-walletDelta(x,w.id)));
    return [w.name,w.currency==='USD'?'دولار':'دينار',f==='2000-01-01'?(+w.opening||0):before,inn,out,bal(w,t),toIQD(bal(w,t),w.currency)]});

  return {title:`${title} (${dg(xs.length)})`,cols:[['التاريخ','d'],['النوع','t'],['البيان','t'],['الفئة','t'],['المحفظة','t'],['لمن','t'],['المبلغ','n'],['بالدينار','m']],

  const rows=S.cats.filter(c=>c.kind===kind).map(c=>{const v=sumTx(x=>x.type===kind&&x.catId===c.id&&inRange(x.date,f,t));return [c.icon+' '+c.name,S.tx.filter(x=>x.type===kind&&x.catId===c.id&&inRange(x.date,f,t)).length,v,tot?v/tot*100:0]}).filter(r=>r[2]>0).sort((a,b)=>b[2]-a[2]);
